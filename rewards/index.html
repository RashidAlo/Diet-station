<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DietStation — Rewards / Pull to Redeem</title>
<style>
  @font-face { font-family: 'Urbane Rounded'; src: url('UrbaneRounded-Light.ttf'); font-weight: 300; }
  @font-face { font-family: 'Urbane Rounded'; src: url('UrbaneRounded-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Urbane Rounded'; src: url('UrbaneRounded-DemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Proxima Nova'; src: url('proxima-regular.otf'); font-weight: 400; }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #94969b; }
  body { font-family: 'Urbane Rounded', -apple-system, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .phone { position: relative; width: 402px; height: 874px; overflow: hidden;
    background: #a6a6a6; transform-origin: center center; }

  /* ---- level theming (exact values from Figma section 17137:76380) --- */
  .phone { /* gold — frame 17137:75698 */
    --sheet-grad: linear-gradient(to top, #e4a70f 48.697%, #ffbc2a 98.639%);
    --tint: rgba(240,168,60,.35);
    --lighter: rgba(173,173,173,.12);
    --t-head:#f9f9f9; --t-body:#fff; --t-sub:#f9f9f9;
    --badge-bg: linear-gradient(to top, #f2b90d 45%, #ffca2a 55%);
    --badge-border:#fefae7; --badge-text:#c59300;
    --check-bg: rgba(255,255,255,.22); --spark:#ffdf8e;
    --voucher-shadow: none; }
  .phone[data-level="bronze"] { /* frame 17137:76256 */
    --sheet-grad: linear-gradient(to bottom, #d5bb9f 24.41%, #c9a682 91.259%);
    --tint: transparent;
    --lighter: rgba(173,173,173,.12);
    --t-head:#0b0e12; --t-body:#0b0e12; --t-sub:#5c3f21;
    --badge-bg: linear-gradient(to bottom, #d5bb9f 45%, #c9a682 55%);
    --badge-border:#ffffff; --badge-text: rgba(76,64,51,.42);
    --check-bg: rgba(0,0,0,.10); --spark:#8a5f36; }
  .phone[data-level="silver"] { /* frame 17137:76130 */
    --sheet-grad: linear-gradient(to bottom, #e5e7eb 19.152%, #d1d5db 86.283%);
    --tint: transparent;
    --lighter: rgba(173,173,173,.06);
    --t-head:#0b0e12; --t-body:#0b0e12; --t-sub:#7a7a7a;
    --badge-bg: linear-gradient(to bottom, #e5e7eb 45%, #d1d5db 55%);
    --badge-border:#e4e4e7; --badge-text: rgba(82,82,91,.46);
    --check-bg: rgba(0,0,0,.08); --spark:#9aa0a8; }
  .phone[data-level="vip"] { /* frame 17137:75818 */
    --sheet-grad: linear-gradient(to bottom, #270f0f 0.461%, #0f0e0d 100%);
    --tint: transparent;
    --lighter: rgba(173,173,173,.12);
    --t-head:#f9f9f9; --t-body:#fff; --t-sub:#f9f9f9;
    --badge-bg: linear-gradient(180deg, #270f0f 38.462%, #0f0e0d 65.385%),
                linear-gradient(180deg, #57524d 45%, #2d2a27 55%);
    --badge-border:#f9f9f9; --badge-text:#fff;
    --check-bg: rgba(255,255,255,.22); --spark:#f2c94c;
    --voucher-shadow: drop-shadow(0 0 12px rgba(56,64,74,.12)); }

  /* ---- sheet --------------------------------------------------------- */
  .sheet { position: absolute; left: 0; top: 68px; width: 402px; height: 806px;
    border-radius: 38px 38px 0 0; overflow: hidden;
    background: var(--sheet-grad); }

  .closebtn { position: absolute; left: 24px; top: 24px; width: 40px; height: 40px;
    border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(9px) saturate(175%);
    backdrop-filter: blur(9px) saturate(175%);
    box-shadow:
      inset 0 1.5px 1px rgba(255,255,255,.15),
      inset 0 -1px 1.5px rgba(255,255,255,.05),
      inset 2px 4px 9px -4px rgba(255,255,255,.20),
      inset -3px -5px 10px -5px rgba(0,0,0,.14),
      0 12px 28px -12px rgba(0,0,0,.20),
      0 1px 2px rgba(0,0,0,.07);
    transition: transform .18s cubic-bezier(.3,.8,.3,1), background .18s ease; }
  .closebtn:active { transform: scale(.92); background: rgba(255,255,255,.19); }
  .closebtn img { width: 20px; height: 20px; display: block; }

  .title { position: absolute; left: 24px; top: 79px; width: 330px;
    font: 500 30px/32px 'Urbane Rounded', sans-serif; color: var(--t-head); letter-spacing: 0; }

  .qualify { position: absolute; left: 24px; top: 149px; height: 24px;
    display: flex; align-items: center; gap: 7px;
    font: 400 14px/20px 'Urbane Rounded', sans-serif; color: var(--t-head); }
  .lvlbadge { display: inline-flex; align-items: center; justify-content: center;
    padding: 4px 10px; border-radius: 99px; border: 2px solid var(--badge-border);
    background: var(--badge-bg);
    box-shadow: 0 4px 2px rgba(0,0,0,.06), 0 2px 2px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.06);
    font: 600 12px/16px 'Urbane Rounded', sans-serif; color: var(--badge-text); }
  .qbtn { width: 16px; height: 16px; border: none; border-radius: 12px; cursor: pointer;
    position: relative; display: flex; align-items: center; justify-content: center;
    background: transparent; }
  .qbtn::before { content: ''; position: absolute; inset: 0; border-radius: 12px;
    background: rgba(173,173,173,.12); mix-blend-mode: plus-lighter; }
  .qbtn img { width: 12px; height: 12px; display: block; position: relative; }

  /* ---- coupons ------------------------------------------------------- */
  .coupons { position: absolute; left: 0; top: 194px; width: 402px;
    padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }

  .coupon { position: relative; width: 368px; height: 125px; filter: var(--voucher-shadow); }

  .coupon .body { position: absolute; left: 0; top: 0; width: 278px; height: 125px;
    border-radius: 24px 0 0 24px; overflow: hidden;
    will-change: transform, width, border-radius; }
  .coupon .stub { position: absolute; left: 277px; top: 0; width: 90px; height: 125px;
    border-radius: 0 24px 24px 0; overflow: hidden; cursor: grab;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; will-change: transform, opacity; }
  .coupon .stub:active { cursor: grabbing; }
  .coupon .body::before, .coupon .stub::before { content: ''; position: absolute; inset: 0;
    background: var(--tint); }
  .coupon .body::after, .coupon .stub::after { content: ''; position: absolute; inset: 0;
    background: var(--lighter); mix-blend-mode: plus-lighter; }

  .coupon .content { position: absolute; left: 25px; top: 28px; bottom: 29px; width: 220px;
    display: flex; flex-direction: column; justify-content: center; z-index: 1;
    transition: opacity .25s ease; }
  .coupon .expires { font: 400 12px/16px 'Proxima Nova', sans-serif; color: var(--t-sub); }
  .coupon .headline { color: var(--t-body); white-space: nowrap; }
  .coupon .headline .big  { font: 600 30px/40px 'Urbane Rounded', sans-serif; }
  .coupon .headline .mid  { font: 600 20px/28px 'Urbane Rounded', sans-serif; }
  .coupon .headline .tail { font: 600 18px/28px 'Urbane Rounded', sans-serif; color: var(--t-head); }
  .coupon .sub { font: 400 10px/13px 'Proxima Nova', sans-serif; color: var(--t-sub); }

  .coupon .perf { position: absolute; left: 277px; top: 50%; height: 110px; width: 0;
    transform: translateY(-50%); z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: center; }
  .coupon .perf img { width: 110px; height: 1px; transform: rotate(90deg); display: block;
    flex: none; }

  .coupon .stub p { position: relative; z-index: 1; text-align: center; pointer-events: none; }
  .coupon .stub .pull { display: block; font: 600 15px/22px 'Urbane Rounded', sans-serif; color: var(--t-body); }
  .coupon .stub .tored { display: block; font: 300 10px/12px 'Urbane Rounded', sans-serif; color: var(--t-head); }

  /* redeemed state */
  .coupon .done-face { position: absolute; inset: 0; z-index: 3; border-radius: 24px;
    display: flex; align-items: center; gap: 14px; padding: 0 25px;
    opacity: 0; pointer-events: none; }
  .coupon .check { width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: var(--check-bg);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center;
    font: 600 22px/1 'Urbane Rounded', sans-serif; color: var(--t-body); }
  .coupon .done-title { font: 600 18px/24px 'Urbane Rounded', sans-serif; color: var(--t-body); }
  .coupon .done-sub { font: 400 11px/15px 'Proxima Nova', sans-serif; color: var(--t-sub); opacity: .9; }
  .coupon .code { display: inline-block; margin-top: 5px; padding: 3px 10px;
    border: 1.5px dashed var(--t-sub); border-radius: 8px;
    font: 600 13px/18px 'Urbane Rounded', sans-serif; color: var(--t-body); letter-spacing: 1.5px; }

  .coupon.redeemed .body { width: 368px; border-radius: 24px;
    transition: width .45s cubic-bezier(.3,1.3,.4,1), border-radius .45s cubic-bezier(.3,1.3,.4,1); }
  .coupon.redeemed .content { opacity: 0; }
  .coupon.redeemed .perf { display: none; }
  .coupon.redeemed .done-face { opacity: 1; pointer-events: auto;
    transition: opacity .35s ease .18s; }

  .spark { position: absolute; border-radius: 50%; pointer-events: none; z-index: 6; }

  /* ---- dev bar ------------------------------------------------------- */
  .devbar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 50;
    display: flex; gap: 6px; align-items: center; padding: 6px;
    border-radius: 999px; background: rgba(20,20,24,.72);
    -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
  .devbar button { border: none; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    background: transparent; color: rgba(255,255,255,.65);
    font: 600 12px/16px 'Urbane Rounded', sans-serif;
    transition: background .18s ease, color .18s ease; }
  .devbar button.on { background: rgba(255,255,255,.16); color: #fff; }
  .devbar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
</style>
</head>
<body>

<div id="stage">
  <div class="phone" id="phone" data-level="gold">
    <div class="sheet">
      <button class="closebtn" id="closeBtn" title="close"><img src="rewards-close.svg" alt=""></button>
      <h1 class="title">Renew and Save on your subscriptions</h1>
      <div class="qualify">
        <span>You qualify to&nbsp;</span>
        <span class="lvlbadge" id="lvlBadge">Gold</span>
        <span>Benefits:</span>
        <button class="qbtn"><img src="rewards-question.svg" alt="?"></button>
      </div>
      <div class="coupons" id="coupons"></div>
    </div>
  </div>
</div>

<div class="devbar" id="devbar">
  <button data-lvl="bronze">Bronze</button>
  <button data-lvl="silver">Silver</button>
  <button data-lvl="gold" class="on">Gold</button>
  <button data-lvl="vip">VIP</button>
  <div class="sep"></div>
  <button id="resetBtn">Reset</button>
</div>

<script>
/* ---------------- level data ---------------- */
const LEVELS = {
  bronze: { label: 'Bronze', q: 'rewards-question-bronze.svg', perf: 'rewards-perforation-bronze.svg' },
  silver: { label: 'Silver', q: 'rewards-question-silver.svg', perf: 'rewards-perforation-silver.svg' },
  gold:   { label: 'Gold',   q: 'rewards-question.svg',        perf: 'rewards-perforation.svg' },
  vip:    { label: 'VIP',    q: 'rewards-question.svg',        perf: 'rewards-perforation.svg' },
};

function couponDefs(lvl) {
  const TAG = LEVELS[lvl].label.toUpperCase();
  return [
    { headline: `<span class="big">25</span><span class="mid">%</span><span class="tail"> OFF</span>`,
      sub: 'Upto KD 80 OFF on any of our subscriptions', code: `DS-${TAG}25` },
    { headline: `<span class="big">GYM</span><span class="tail"> Subscription</span>`,
      sub: 'Upto KD 80 OFF on any of our subscriptions', code: `GYM-${TAG}` },
    { headline: `<span class="big">KIDS </span><span class="mid">subscription</span>`,
      sub: 'Upto KD 80 OFF on any of our subscriptions', code: `KIDS-${TAG}` },
  ];
}

/* ---------------- build coupons ---------------- */
const phone = document.getElementById('phone');
const list = document.getElementById('coupons');
const lvlBadge = document.getElementById('lvlBadge');

function buildCoupons() {
  const theme = LEVELS[phone.dataset.level];
  document.querySelector('.qbtn img').src = theme.q;
  list.innerHTML = '';
  couponDefs(phone.dataset.level).forEach(def => {
    const el = document.createElement('div');
    el.className = 'coupon';
    el.innerHTML = `
      <div class="body">
        <div class="content">
          <div class="expires">Expires in 1 Day</div>
          <div class="headline">${def.headline}</div>
          <div class="sub">${def.sub}</div>
        </div>
      </div>
      <div class="perf"><img src="${theme.perf}" alt=""></div>
      <div class="stub"><p><span class="pull">Pull</span><span class="tored">to Redeem</span></p></div>
      <div class="done-face">
        <div class="check">&#10003;</div>
        <div>
          <div class="done-title">Redeemed</div>
          <div class="done-sub">Applied to your next renewal</div>
          <span class="code">${def.code}</span>
        </div>
      </div>`;
    list.appendChild(el);
    attachPull(el);
  });
}

/* ---------------- pull-to-redeem gesture ---------------- */
const MAX_PULL = 96;    // px of visual travel at full stretch
const TEAR_AT  = 62;    // visual px at which the stub tears off

function attachPull(coupon) {
  const stub = coupon.querySelector('.stub');
  const body = coupon.querySelector('.body');
  const perf = coupon.querySelector('.perf img');
  let dragging = false, torn = false, startX = 0, raf = 0, disp = 0;
  let hintTimer = 0, interacted = false;

  const setPull = (d) => {
    disp = d;
    const p = Math.min(d / TEAR_AT, 1);
    stub.style.transform = `translateX(${d}px) rotate(${d * 0.055}deg)`;
    body.style.transform = `translateX(${-d * 0.07}px)`;
    perf.style.opacity = 1 - p * 0.75;
    stub.style.filter = `brightness(${1 + p * 0.18})`;
  };

  const onDown = (e) => {
    if (torn) return;
    interacted = true; clearTimeout(hintTimer);
    dragging = true; startX = e.clientX;
    stub.setPointerCapture(e.pointerId);
    stub.style.transition = body.style.transition = 'none';
  };

  const onMove = (e) => {
    if (!dragging || torn) return;
    const raw = Math.max(0, (e.clientX - startX) / stageScale);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const d = MAX_PULL * Math.tanh(raw / 90);   // elastic resistance
      setPull(d);
      if (d >= TEAR_AT) tear(e.pointerId);
    });
  };

  const onUp = () => {
    if (!dragging || torn) return;
    dragging = false;
    // spring back with a little overshoot wobble
    stub.animate([
      { transform: `translateX(${disp}px) rotate(${disp * 0.055}deg)` },
      { transform: 'translateX(-5px) rotate(-0.4deg)', offset: .6 },
      { transform: 'translateX(2px)', offset: .82 },
      { transform: 'translateX(0)' },
    ], { duration: 480, easing: 'cubic-bezier(.25,.9,.3,1)' });
    body.animate([
      { transform: `translateX(${-disp * 0.07}px)` },
      { transform: 'translateX(1px)', offset: .7 },
      { transform: 'translateX(0)' },
    ], { duration: 480, easing: 'cubic-bezier(.25,.9,.3,1)' });
    stub.style.transform = 'translateX(0)';
    body.style.transform = 'translateX(0)';
    perf.style.opacity = 1; stub.style.filter = '';
    armHint();
  };

  const tear = (pointerId) => {
    torn = true; dragging = false;
    try { stub.releasePointerCapture(pointerId); } catch (_) {}
    try { navigator.vibrate && navigator.vibrate(25); } catch (_) {}
    // stub rips off and flies away
    stub.animate([
      { transform: `translateX(${disp}px) rotate(${disp * 0.055}deg)`, opacity: 1 },
      { transform: `translateX(${disp + 150}px) translateY(14px) rotate(21deg)`, opacity: 0 },
    ], { duration: 420, easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });
    burst(coupon);
    // coupon body relaxes, then expands into redeemed state
    body.style.transform = 'translateX(0)';
    setTimeout(() => coupon.classList.add('redeemed'), 140);
  };

  stub.addEventListener('pointerdown', onDown);
  stub.addEventListener('pointermove', onMove);
  stub.addEventListener('pointerup', onUp);
  stub.addEventListener('pointercancel', onUp);

  /* idle nudge hint until first touch */
  const armHint = () => {
    clearTimeout(hintTimer);
    if (interacted || torn) return;
    hintTimer = setTimeout(() => {
      if (interacted || torn) return;
      stub.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(9px) rotate(.5deg)', offset: .3 },
        { transform: 'translateX(0)', offset: .55 },
        { transform: 'translateX(6px)', offset: .75 },
        { transform: 'translateX(0)' },
      ], { duration: 900, easing: 'ease-in-out' });
      armHint();
    }, 2600 + Math.random() * 1800);
  };
  armHint();
}

/* confetti burst at the perforation */
function burst(coupon) {
  const rect = coupon.getBoundingClientRect();
  const cs = getComputedStyle(phone);
  const colors = ['#ffffff', cs.getPropertyValue('--spark').trim(), 'rgba(255,255,255,.7)'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const size = 3 + Math.random() * 5;
    s.style.width = s.style.height = size + 'px';
    s.style.background = colors[i % colors.length];
    s.style.left = (rect.left + 277 * stageScale) + 'px';
    s.style.top = (rect.top + rect.height * (0.2 + Math.random() * 0.6)) + 'px';
    document.body.appendChild(s);
    const dx = (30 + Math.random() * 130) * (Math.random() > .18 ? 1 : -0.4);
    const dy = (Math.random() - 0.6) * 120;
    s.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 70}px) scale(.2)`, opacity: 0 },
    ], { duration: 550 + Math.random() * 300, easing: 'cubic-bezier(.2,.6,.4,1)', fill: 'forwards' })
      .onfinish = () => s.remove();
  }
}

/* ---------------- level switching / dev bar ---------------- */
document.getElementById('devbar').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'resetBtn') { buildCoupons(); return; }
  const lvl = b.dataset.lvl; if (!lvl) return;
  document.querySelectorAll('.devbar [data-lvl]').forEach(x => x.classList.toggle('on', x === b));
  phone.dataset.level = lvl;
  lvlBadge.textContent = LEVELS[lvl].label;
  buildCoupons();
});

document.getElementById('closeBtn').addEventListener('click', () => {
  location.href = '../';
});

/* ---------------- stage scaling ---------------- */
let stageScale = 1;
function fit() {
  stageScale = Math.min(innerWidth / 402, innerHeight / 874);
  phone.style.transform = `scale(${stageScale})`;
}
addEventListener('resize', fit);
fit();
buildCoupons();
</script>
</body>
</html>
