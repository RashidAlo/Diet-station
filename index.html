<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DietStation Design Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ED1C24">
<style>
  @font-face { font-family: 'Urbane Rounded'; src: url('breathe/UrbaneRounded-DemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Urbane Rounded'; src: url('breathe/UrbaneRounded-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Proxima Nova'; src: url('breathe/proxima-regular.otf'); font-weight: 400; }
  :root {
    --ground: #FBF8F7;
    --card: #FFFFFF;
    --ink: #221A1B;
    --ink-soft: #6E6264;
    --line: #EFE6E5;
    --red: #ED1C24;
    --red-soft: #FFF2F2;
    --ok: #1F8A4C;
    --ok-soft: #EAF6EF;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 400 15px/1.6 'Proxima Nova', -apple-system, 'Helvetica Neue', sans-serif;
    padding: 56px 20px 96px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--red);
    display: inline-block; margin-right: 10px; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(.82); opacity:.75 } 45% { transform: scale(1.12); opacity:1 } }
  h1 { font: 600 28px/1.2 'Urbane Rounded', sans-serif; letter-spacing: 0; display: flex; align-items: center; }
  .sub { color: var(--ink-soft); margin-top: 8px; max-width: 54ch; }
  .count { margin: 40px 0 14px; font: 500 12px/1 'Urbane Rounded', sans-serif;
    text-transform: uppercase; letter-spacing: .12em; color: var(--ink-soft); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 26px 26px 22px; margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(34,26,27,.03), 0 12px 32px -24px rgba(34,26,27,.18);
  }
  .card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card h2 { font: 600 19px/1.3 'Urbane Rounded', sans-serif; margin-right: auto; }
  .pill { font: 500 11px/1 'Urbane Rounded', sans-serif; letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 10px 5px; border-radius: 999px; white-space: nowrap; }
  .pill.in-progress { background: var(--red-soft); color: var(--red); }
  .pill.ready { background: var(--ok-soft); color: var(--ok); }
  .tag { font: 500 11px/1 'Urbane Rounded', sans-serif; letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 10px 5px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink-soft); white-space: nowrap; }
  .row { display: flex; gap: 22px; align-items: flex-start; }
  .row .body { flex: 1; min-width: 0; }
  .thumb { flex: none; display: block; }
  .thumb img { width: 96px; aspect-ratio: 402 / 874; object-fit: cover; display: block;
    border-radius: 14px; border: 1px solid var(--line);
    box-shadow: 0 10px 24px -16px rgba(34,26,27,.35); }
  @media (max-width: 480px) { .thumb img { width: 76px; } }
  .card .desc { color: var(--ink-soft); margin: 10px 0 0; max-width: 60ch; }
  .card .meta { color: var(--ink-soft); font-size: 12.5px; margin-top: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn { font: 500 14px/1 'Urbane Rounded', sans-serif; text-decoration: none; cursor: pointer;
    border-radius: 999px; padding: 12px 20px; border: 1px solid transparent; }
  .btn.primary { background: var(--red); color: #fff; }
  .btn.primary:hover { background: #d4141c; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--ink-soft); }
  .btn.ghost[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .handoff { display: none; margin-top: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
  .handoff.open { display: block; }
  .handoff h3 { font: 500 12px/1 'Urbane Rounded', sans-serif; text-transform: uppercase;
    letter-spacing: .12em; color: var(--ink-soft); margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: 132px 1fr; gap: 7px 16px; font-size: 13.5px; }
  .kv dt { color: var(--ink-soft); }
  .kv dd { color: var(--ink); overflow-wrap: anywhere; }
  .dl { margin-top: 16px; display: flex; gap: 14px; flex-wrap: wrap; }
  .dl a { color: var(--red); text-decoration: none; font-size: 13.5px; border-bottom: 1px solid var(--red-soft); }
  .dl a:hover { border-bottom-color: var(--red); }
  footer { margin-top: 48px; color: var(--ink-soft); font-size: 12.5px; }
  @media (max-width: 480px) { .kv { grid-template-columns: 1fr; gap: 2px 0; } .kv dt { margin-top: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>DietStation Design Lab</h1>
    <p class="sub">Living prototypes of every design feature in the works — open a flow to
    test it on any device, or expand its handoff panel for the specs and assets developers need.</p>
  </header>
  <div class="count" id="count"></div>
  <main id="flows"></main>
  <footer>Maintained by Rashid × Claude · sources in the dietstation-rive repo</footer>
</div>
<script>
fetch('flows.json').then(r => r.json()).then(({ flows }) => {
  document.getElementById('count').textContent =
    flows.length + (flows.length === 1 ? ' flow' : ' flows');
  const root = document.getElementById('flows');
  for (const f of flows) {
    const card = document.createElement('section');
    card.className = 'card';
    const statusLabel = f.status === 'ready' ? 'Ready' : 'In progress';
    const kv = Object.entries(f.handoff || {}).map(([k, v]) =>
      `<dt>${k}</dt><dd>${v}</dd>`).join('');
    const dl = (f.downloads || []).map(d =>
      `<a href="${d.href}" download>${d.label}</a>`).join('');
    const tags = [f.platform, f.area].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('');
    card.innerHTML = `
      <div class="row">
        <div class="body">
          <div class="top">
            <h2>${f.title}</h2>
            ${tags}
            <span class="pill ${f.status}">${statusLabel}</span>
          </div>
          <p class="desc">${f.description}</p>
          <p class="meta">Updated ${f.updated}</p>
        </div>
        ${f.preview ? `<a class="thumb" href="${f.path}"><img src="${f.preview}" alt="${f.title} preview"></a>` : ''}
      </div>
      <div class="actions">
        <a class="btn primary" href="${f.path}">Open prototype</a>
        <button class="btn ghost" aria-expanded="false">Dev handoff</button>
      </div>
      <div class="handoff">
        <h3>Handoff</h3>
        <dl class="kv">${kv}</dl>
        <div class="dl">${dl}</div>
      </div>`;
    const btn = card.querySelector('button');
    const panel = card.querySelector('.handoff');
    btn.onclick = () => {
      const open = panel.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    };
    root.appendChild(card);
  }
});
</script>
</body>
</html>
